name: Accessibility CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  accessibility-scan:
    name: Accessibility Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start server in background
        run: |
          npm run preview &
          npx wait-on http://localhost:4173

      - name: Run Pa11y CI
        run: |
          npm install -g pa11y
          pa11y http://localhost:4173 --threshold 0 --config pa11y.json

      - name: Run axe-core on all pages
        run: |
          npm install -g @axe-core/cli
          # Create a list of URLs to test
          URLs=(
            "http://localhost:4173/"
            "http://localhost:4173/products"
            "http://localhost:4173/availability"
            "http://localhost:4173/locations"
            "http://localhost:4173/faq"
            "http://localhost:4173/contact"
          )

          mkdir -p a11y-results

          for url in "${URLS[@]}"; do
            echo "Testing $url"
            filename=$(echo $url | sed 's/http:\/\/localhost:4173\///' | sed 's/\//_/g')
            axe $url --tags wcag2a,wcag2aa > "a11y-results/${filename}.json" || true
            axe $url --tags wcag2a,wcag2aa --format csv > "a11y-results/${filename}.csv" || true
          done

      - name: Generate accessibility report
        if: always()
        run: |
          echo "# Accessibility Scan Results" > a11y-results/summary.md
          echo "" >> a11y-results/summary.md
          echo "## Violations by Page" >> a11y-results/summary.md
          echo "" >> a11y-results/summary.md

          for file in a11y-results/*.json; do
            if [ -f "$file" ]; then
              url=$(basename "$file" .json | sed 's/_/\//g')
              violations=$(cat "$file" | jq '.violations | length')
              echo "- **$url**: $violations violations" >> a11y-results/summary.md
            fi
          done

          cat a11y-results/summary.md

      - name: Upload accessibility results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-scan-results
          path: a11y-results/
          retention-days: 90

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('a11y-results/summary.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Fail on violations
        run: |
          total_violations=0
          for file in a11y-results/*.json; do
            if [ -f "$file" ]; then
              violations=$(cat "$file" | jq '.violations | length')
              total_violations=$((total_violations + violations))
            fi
          done

          if [ $total_violations -gt 0 ]; then
            echo "Found $total_violations accessibility violations"
            exit 1
          fi

          echo "No accessibility violations found!"

  keyboard-navigation:
    name: Keyboard Navigation Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run keyboard navigation tests
        run: npx playwright test e2e/keyboard-nav.spec.ts --project=chromium

      - name: Upload keyboard navigation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyboard-navigation-results
          path: playwright-report/
